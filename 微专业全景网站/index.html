/* ---------- 关联页面（三个 index 页面统一的横向入口） ---------- */
.peer-nav{margin:0 0 26px;padding:14px 16px;background:#fff;border:1px solid #e4e8f1;

.peer-head b{font-size:12.5px;letter-spacing:.06em;color:#2f3fa8}

.peer-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.peer-link{display:block;padding:10px 12px;border:1px solid #dde3f1;border-radius:9px;

.peer-link b{display:block;font-size:13px;color:#2f3fa8;line-height:1.5}
.peer-link span{display:block;font-size:11.5px;color:#6d7690;line-height:1.55;margin-top:3px}
a.peer-link:hover{border-color:#9fb0ff;background:#eef1ff;text-decoration:none}
.peer-link.is-current{border-color:#c9d4ff;background:#eef1ff;cursor:default}
.peer-link.is-current b{color:#1a2135}
.peer-link.is-current b:after{content:" · 当前页面";font-size:11px;font-weight:400;color:#6d7690}
@media (max-width:760px){.peer-links{grid-template-columns:1fr}}
